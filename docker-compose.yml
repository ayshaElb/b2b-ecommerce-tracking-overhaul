version: '3.8'

services:
  gtm-server-side:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtm_ss_proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
